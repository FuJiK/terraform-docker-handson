---
- name: Install and configure private MariaDB
  hosts: db
  become: true
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Configure APT to use the web-host proxy (DB has no NAT)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/90-lab-proxy
        content: |
          Acquire::http::Proxy "http://{{ hostvars['web'].private_ip }}:3128/";
          Acquire::https::Proxy "http://{{ hostvars['web'].private_ip }}:3128/";
        owner: root
        group: root
        mode: "0644"

    - name: Install MariaDB and PyMySQL
      ansible.builtin.apt:
        name:
          - mariadb-server
          - python3-pymysql
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Bind MariaDB only to DB private address
      ansible.builtin.copy:
        dest: /etc/mysql/mariadb.conf.d/60-wordpress-lab.cnf
        content: |
          [mysqld]
          bind-address = {{ private_ip }}
          skip-name-resolve = 1
          local-infile = 0
        owner: root
        group: root
        mode: "0644"
      notify: Restart MariaDB

    - name: Ensure MariaDB service is running
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Apply MariaDB configuration before creating the database
      ansible.builtin.meta: flush_handlers

    - name: Create WordPress database
      community.mysql.mysql_db:
        name: wordpress
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create restricted WordPress database user
      community.mysql.mysql_user:
        name: wordpress
        host: "{{ hostvars['web'].private_ip }}"
        password: "{{ wordpress_db_password }}"
        priv: "wordpress.*:ALL"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
      no_log: true

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted

- name: Install WordPress on public web EC2
  hosts: web
  become: true
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Install Nginx, PHP and WordPress prerequisites
      ansible.builtin.apt:
        name:
          - nginx
          - php8.3-fpm
          - php8.3-mysql
          - php8.3-curl
          - php8.3-xml
          - php8.3-gd
          - php8.3-mbstring
          - php8.3-zip
          - php8.3-intl
          - unzip
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create WordPress document root
      ansible.builtin.file:
        path: /var/www/wordpress
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Download WordPress CLI
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        dest: /usr/local/bin/wp
        owner: root
        group: root
        mode: "0755"

    - name: Check for downloaded WordPress core
      ansible.builtin.stat:
        path: /var/www/wordpress/wp-includes/version.php
      register: wp_core

    - name: Download WordPress core through wp-cli
      ansible.builtin.command:
        argv: [/usr/local/bin/wp, core, download, "--path=/var/www/wordpress"]
      become_user: www-data
      when: not wp_core.stat.exists

    - name: Create WordPress config only once
      ansible.builtin.command:
        argv:
          - /usr/local/bin/wp
          - config
          - create
          - "--path=/var/www/wordpress"
          - "--dbname=wordpress"
          - "--dbuser=wordpress"
          - "--dbpass={{ wordpress_db_password }}"
          - "--dbhost={{ hostvars['db'].private_ip }}"
          - "--dbcharset=utf8mb4"
          - "--skip-check"
        creates: /var/www/wordpress/wp-config.php
      become_user: www-data
      no_log: true

    - name: Restrict WordPress configuration file permissions
      ansible.builtin.file:
        path: /var/www/wordpress/wp-config.php
        owner: www-data
        group: www-data
        mode: "0640"

    - name: Configure Nginx for WordPress
      ansible.builtin.template:
        src: templates/wordpress-nginx.conf.j2
        dest: /etc/nginx/sites-available/wordpress
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx

    - name: Disable default Nginx virtual host
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Enable WordPress site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/wordpress
        dest: /etc/nginx/sites-enabled/wordpress
        state: link
      notify: Reload Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Ensure Nginx and PHP are running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nginx
        - php8.3-fpm

    - name: Apply Nginx changes
      ansible.builtin.meta: flush_handlers

    - name: Check whether WordPress is installed
      ansible.builtin.command:
        argv: [/usr/local/bin/wp, core, is-installed, "--path=/var/www/wordpress"]
      become_user: www-data
      register: wp_installed
      failed_when: false
      changed_when: false

    - name: Perform first-time WordPress setup
      ansible.builtin.command:
        argv:
          - /usr/local/bin/wp
          - core
          - install
          - "--path=/var/www/wordpress"
          - "--url={{ wordpress_url }}"
          - "--title={{ wordpress_site_title }}"
          - "--admin_user={{ wordpress_admin_user }}"
          - "--admin_password={{ wordpress_admin_password }}"
          - "--admin_email={{ wordpress_admin_email }}"
          - "--skip-email"
      become_user: www-data
      when: wp_installed.rc != 0
      no_log: true

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
